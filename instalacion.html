  <main class="installation-page">
    <header class="installation-intro">
      <h1>Formas de instalación de los programas</h1>
    </header>

    <section class="installation-method" aria-labelledby="android-install-title">
      <h2 id="android-install-title">Instalaciones en Android</h2>
      <!-- Reemplaza el src por la URL de inserción del video de YouTube. -->
      <div class="youtube-frame">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/uBYiZKH9qUE?si=ymdQwFrCqwZeDLn6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <!-- Reemplaza el enlace por la URL del video de instalación para Android. -->
      <a
        class="installation-youtube-button"
        href="https://www.youtube.com/watch?v=uBYiZKH9qUE"
        target="_blank"
        rel="noopener noreferrer"
        >Ver en YouTube</a
      >
    </section>

    <section class="installation-method" aria-labelledby="windows-install-title">
      <h2 id="windows-install-title">Instalación en Windows</h2>
      <!-- Reemplaza el src por la URL de inserción del video de YouTube. -->
      <div class="youtube-frame">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/JlkSy3Yg7ig?si=hpQowAvhalKmM3xo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <!-- Reemplaza el enlace por la URL del video de instalación para Windows. -->
      <a
        class="installation-youtube-button"
        href="https://www.youtube.com/watch?v=JlkSy3Yg7ig"
        target="_blank"
        rel="noopener noreferrer"
        >Ver en YouTube</a
      >
    </section>
